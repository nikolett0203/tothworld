<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Space Age Aesthetic</title>
    <link href="https://fonts.cdnfonts.com/css/positions-by-arixbored" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Starry sky background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        .star:nth-child(odd) {
            animation-delay: 1s;
        }

        .star:nth-child(3n) {
            animation-delay: 2s;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Shooting stars */
        .shooting-star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: shoot 3s linear infinite;
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, white);
            transform: translateX(100%);
        }

        @keyframes shoot {
            0% {
                opacity: 0;
                transform: translateX(-100px) translateY(100px);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(300px) translateY(-300px);
            }
        }

        .container {
            position: relative;
            min-height: 100vh;
            display: flex;
        }

        /* Vertical sidebar text */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .vertical-text {
            writing-mode: vertical-lr;
            text-orientation: mixed;
            font-size: 14px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 2px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .vertical-text:hover {
            color: white;
            transform: translateX(5px);
        }

        /* Main content area */
        .main-content {
            margin-left: 120px;
            width: calc(100% - 120px);
            min-height: 100vh;
            position: relative;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 40px;
            right: 40px;
            display: flex;
            gap: 30px;
            z-index: 100;
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item:hover {
            color: white;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: white;
            transition: width 0.3s ease;
        }

        .nav-item:hover::after {
            width: 100%;
        }

        /* Hero section */
        .hero {
            padding: 100px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        .hero-title {
            font-family: 'Positions by arixbored', sans-serif;
            font-size: clamp(4rem, 8vw, 8rem);
            font-weight: 400;
            color: white;
            line-height: 0.9;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .hero-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Orbiting system */
        .orbit-system {
            position: absolute;
            right: 10%;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 300px;
        }

        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit-ring-1 {
            width: 80px;
            height: 80px;
            animation: rotate 8s linear infinite;
        }

        .orbit-ring-2 {
            width: 140px;
            height: 140px;
            animation: rotate 15s linear infinite;
        }

        .orbit-ring-3 {
            width: 200px;
            height: 200px;
            animation: rotate 25s linear infinite;
        }

        .orbit-ring-4 {
            width: 260px;
            height: 260px;
            animation: rotate 40s linear infinite;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .planet-1 {
            width: 8px;
            height: 8px;
            background: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
        }

        .planet-2 {
            width: 6px;
            height: 6px;
            background: #4ecdc4;
            box-shadow: 0 0 8px rgba(78, 205, 196, 0.6);
        }

        .planet-3 {
            width: 10px;
            height: 10px;
            background: #45b7d1;
            box-shadow: 0 0 12px rgba(69, 183, 209, 0.6);
        }

        .planet-4 {
            width: 5px;
            height: 5px;
            background: #f9ca24;
            box-shadow: 0 0 6px rgba(249, 202, 36, 0.6);
        }

        /* Central star */
        .central-star {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #fff, #ffeb3b);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.2); }
        }

        /* CTA Buttons */
        .cta-buttons {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Stats section */
        .stats {
            position: absolute;
            bottom: 80px;
            right: 60px;
            text-align: right;
        }

        .stat-number {
            font-family: 'Positions by arixbored', sans-serif;
            font-size: 3rem;
            color: white;
            font-weight: 400;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Glassmorphism cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            margin: 20px 0;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            
            .main-content {
                margin-left: 80px;
                width: calc(100% - 80px);
            }
            
            .hero {
                padding: 60px 30px;
            }
            
            .nav {
                top: 20px;
                right: 20px;
                gap: 20px;
            }
            
            .orbit-system {
                width: 200px;
                height: 200px;
                right: 5%;
            }

            .orbit-ring-1 {
                width: 60px;
                height: 60px;
            }

            .orbit-ring-2 {
                width: 100px;
                height: 100px;
            }

            .orbit-ring-3 {
                width: 140px;
                height: 140px;
            }

            .orbit-ring-4 {
                width: 180px;
                height: 180px;
            }
            
            .stats {
                bottom: 40px;
                right: 30px;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Starry Sky Background -->
        <div class="stars" id="stars"></div>
        
        <!-- Shooting Stars -->
        <div class="shooting-star" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
        <div class="shooting-star" style="top: 60%; left: 30%; animation-delay: 5s;"></div>
        <div class="shooting-star" style="top: 40%; left: 70%; animation-delay: 8s;"></div>
        <div class="shooting-star" style="top: 80%; left: 50%; animation-delay: 12s;"></div>

        <!-- Vertical Sidebar -->
        <div class="sidebar">
            <div class="vertical-text">GITHUB</div>
            <div class="vertical-text">LINKEDIN</div>
            <div class="vertical-text">RESUME</div>
            <div class="vertical-text">DEVELOPER</div>
        </div>

        <!-- Navigation -->
        <nav class="nav">
            <a href="#" class="nav-item">HOME</a>
            <a href="#" class="nav-item">WORK</a>
            <a href="#" class="nav-item">ABOUT</a>
            <a href="#" class="nav-item">CONTACT</a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <section class="hero">
                <h1 class="hero-title">
                    toth<br>
                    world
                </h1>
                <p class="hero-subtitle">
                    Crafting digital experiences that blend artistry with innovation. 
                    Where space-age aesthetics meet timeless design principles, 
                    creating something truly extraordinary.
                </p>
                
                <div class="cta-buttons">
                    <a href="#" class="btn btn-primary">VIEW MY WORK</a>
                    <a href="#" class="btn btn-secondary">GET IN TOUCH</a>
                </div>

                <!-- Orbiting System -->
                <div class="orbit-system">
                    <div class="central-star"></div>
                    
                    <div class="orbit-ring orbit-ring-1">
                        <div class="planet planet-1"></div>
                    </div>
                    
                    <div class="orbit-ring orbit-ring-2">
                        <div class="planet planet-2"></div>
                    </div>
                    
                    <div class="orbit-ring orbit-ring-3">
                        <div class="planet planet-3"></div>
                    </div>
                    
                    <div class="orbit-ring orbit-ring-4">
                        <div class="planet planet-4"></div>
                    </div>
                </div>
            </section>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-number">50+</div>
                <div class="stat-label">Projects Completed</div>
            </div>
        </main>
    </div>

    <script>
        // Add smooth hover effects and interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Generate random stars
            const starsContainer = document.getElementById('stars');
            const numStars = 150;
            
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                
                // Vary star sizes
                if (Math.random() > 0.8) {
                    star.style.width = '3px';
                    star.style.height = '3px';
                }
                
                starsContainer.appendChild(star);
            }

            // Smooth scrolling for navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    // Add your navigation logic here
                });
            });

            // Add cursor interaction with orbit system
            const orbitSystem = document.querySelector('.orbit-system');
            document.addEventListener('mousemove', function(e) {
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                orbitSystem.style.transform = `translateY(-50%) translateX(${mouseX * 10}px) translateY(${mouseY * 5}px)`;
            });

            // Parallax effect for vertical text
            window.addEventListener('scroll', function() {
                const scrolled = window.pageYOffset;
                const verticalTexts = document.querySelectorAll('.vertical-text');
                
                verticalTexts.forEach((text, index) => {
                    const speed = 0.5 + (index * 0.1);
                    text.style.transform = `translateY(${scrolled * speed}px)`;
                });
            });
        });
    </script>
</body>
</html>
