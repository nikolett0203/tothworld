<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nikolett's Portfolio - Projects</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SUSE:wght@100..800&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      font-family: 'Urbanist', sans-serif;
      overflow-x: hidden;
      min-height: 200vh;
    }

    /* Hero section */
    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .hero-content {
      text-align: center;
      color: white;
      position: relative;
    }

    .moon-icon {
      font-size: 50px;
      margin-bottom: 15px;
      opacity: 0.9;
      display: block;
    }

    .hero h1 {
      font-size: clamp(40px, 8vw, 60px);
      font-weight: 500;
      margin-bottom: 2rem;
      letter-spacing: 4px;
      animation: float 6s ease-in-out infinite;
    }

    .hero-subtitle {
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 1px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Projects section */
    .projects-section {
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-title {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 300;
      letter-spacing: 3px;
      text-align: center;
      opacity: 0.9;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    .sun {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #764ba2;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
      z-index: 10;
      pointer-events: none;
    }

    /* Project modal */
    .project-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .project-modal.active {
      display: flex;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      max-width: 500px;
      width: 90%;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
      transition: color 0.3s ease;
    }

    .modal-close:hover {
      color: #333;
    }

    .project-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #333;
    }

    .project-description {
      font-size: 16px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 20px;
    }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tech-tag {
      background: rgba(118, 75, 162, 0.1);
      color: #764ba2;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .project-links {
      display: flex;
      gap: 15px;
    }

    .project-link {
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .link-primary {
      background: #764ba2;
      color: white;
    }

    .link-primary:hover {
      background: #5a3680;
      transform: translateY(-2px);
    }

    .link-secondary {
      background: transparent;
      color: #764ba2;
      border: 2px solid #764ba2;
    }

    .link-secondary:hover {
      background: #764ba2;
      color: white;
    }

    /* Click hint */
    .click-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 1px;
      text-align: center;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <div class="hero">
    <div class="hero-content">
      <div class="moon-icon">🌙</div>
      <h1>nikolett's portfolio</h1>
      <div class="hero-subtitle">
        computer science student • environmental science graduate • currently @ GHD
      </div>
    </div>
  </div>

  <!-- Projects Section -->
  <div class="projects-section">
    <h2 class="section-title">explore my projects</h2>
    <div class="sun">projects</div>
    <canvas id="canvas"></canvas>
    <div class="click-hint">click on any planet to explore</div>
  </div>

  <!-- Project Modal -->
  <div class="project-modal" id="projectModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener('resize', resize);

    const centerX = () => canvas.width / 2;
    const centerY = () => canvas.height / 2;

    const tilt = 0.5; // 0 = top-down, 1 = full side-on

    // Project data
    const projectData = {
      0: {
        title: 'Portfolio Website',
        description: 'A responsive personal portfolio website featuring animated backgrounds, smooth scrolling, and modern design principles. Built with vanilla HTML, CSS, and JavaScript with focus on performance and accessibility.',
        tech: ['HTML5', 'CSS3', 'JavaScript', 'Responsive Design'],
        links: { live: '#', github: 'https://github.com/nikolett0203' }
      },
      1: {
        title: 'Environmental Data Dashboard',
        description: 'Interactive data visualization dashboard analyzing climate patterns and environmental trends. Features real-time data processing, statistical analysis, and dynamic charts for environmental monitoring.',
        tech: ['Python', 'Pandas', 'Plotly', 'Flask', 'API Integration'],
        links: { live: '#', github: 'https://github.com/nikolett0203' }
      },
      2: {
        title: 'Sustainability Tracker',
        description: 'Web application helping organizations track their carbon footprint and sustainability metrics. Includes data visualization, goal setting, and progress tracking features.',
        tech: ['React', 'Node.js', 'MongoDB', 'Chart.js'],
        links: { live: '#', github: 'https://github.com/nikolett0203' }
      },
      3: {
        title: 'Campus Navigation App',
        description: 'Mobile application providing indoor navigation for university campus buildings. Features real-time location tracking, route optimization, and accessibility-focused design.',
        tech: ['React Native', 'Firebase', 'Google Maps API', 'GPS'],
        links: { live: '#', github: 'https://github.com/nikolett0203' }
      }
    };

    const planets = [
      { rX: 100, rY: 60, speed: 0.01, angle: 0, size: 6, color: 'white', id: 0 },
      { rX: 160, rY: 90, speed: 0.006, angle: 1, size: 8, color: 'white', id: 1 },
      { rX: 240, rY: 130, speed: 0.004, angle: 2, size: 10, color: 'white', id: 2 },
      { rX: 320, rY: 180, speed: 0.0025, angle: 3.2, size: 7, color: 'white', id: 3 }
    ];

    // Click detection
    canvas.addEventListener('click', function(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      planets.forEach(p => {
        const planetX = centerX() + p.rX * Math.cos(p.angle);
        const planetY = centerY() + p.rY * Math.sin(p.angle) * tilt;
        
        const distance = Math.sqrt((clickX - planetX) ** 2 + (clickY - planetY) ** 2);
        
        if (distance <= p.size + 5) { // 5px tolerance
          openModal(p.id);
        }
      });
    });

    // Modal functions
    function openModal(projectId) {
      const project = projectData[projectId];
      const modalContent = document.getElementById('modalContent');
      
      modalContent.innerHTML = `
        <h3 class="project-title">${project.title}</h3>
        <p class="project-description">${project.description}</p>
        <div class="project-tech">
          ${project.tech.map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
        </div>
        <div class="project-links">
          <a href="${project.links.live}" class="project-link link-primary">View Live</a>
          <a href="${project.links.github}" class="project-link link-secondary" target="_blank">GitHub</a>
        </div>
      `;
      
      document.getElementById('projectModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('projectModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // Modal event listeners
    document.getElementById('projectModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw each orbit as a tilted ellipse
      planets.forEach(p => {
        ctx.beginPath();
        ctx.ellipse(centerX(), centerY(), p.rX, p.rY * tilt, 0, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.stroke();
      });

      // Draw each planet
      planets.forEach(p => {
        const x = centerX() + p.rX * Math.cos(p.angle);
        const y = centerY() + p.rY * Math.sin(p.angle) * tilt;

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, 2 * Math.PI);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fill();

        // Add hover effect - make cursor pointer when near planet
        ctx.globalCompositeOperation = 'source-over';

        p.angle += p.speed;
      });

      requestAnimationFrame(draw);
    }

    draw();
  </script>

</body>
</html>
